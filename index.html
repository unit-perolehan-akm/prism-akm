<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#081226">
  <title>PRISM AKM</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #081226;
    }

    /* Paparan Web App Utama */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Skrin Pembuka (Splash Screen) */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #0f2147 0%, #060d1c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Animasi Logo Makin Besar & Hilang (5 Saat) */
    #splash-logo {
      width: 150px;
      height: 150px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: zoomInAndVanish 5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes zoomInAndVanish {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }
      15% {
        opacity: 1;
        transform: scale(1.0);
      }
      75% {
        opacity: 1;
        transform: scale(1.85);
      }
      100% {
        opacity: 0;
        transform: scale(2.8);
      }
    }

    /* Sembunyikan lapisan splash selepas selesai */
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Skrin Logo Zoom In & Hilang -->
  <div id="splash-screen">
    <img id="splash-logo" src="icon.png" alt="PRISM AKM">
  </div>

  <!-- Sistem PRISM (Google Apps Script) -->
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzA8m1NzO-gLzWANOPtZchmlJuaEs_p3Q6BD7vPiAafCEzz1wRMXymJ0-ii-QELIflx/exec"></iframe>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const splash = document.getElementById('splash-screen');
      // Animasi berjalan selama 5 saat (5000ms), kemudian mendedahkan paparan log masuk
      setTimeout(function () {
        splash.classList.add('fade-out');
      }, 4600);
    });
  </script>

</body>
</html>
