<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#081226">
  <title>PRISM AKM</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #081226; /* Warna biru gelap sepadan dengan latar logo */
    }

    /* Paparan Web App Utama */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Skrin Pembuka (Splash Screen) */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #0f2147 0%, #060d1c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    /* Animasi Logo Zoom Out */
    #splash-logo {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: logoZoomOut 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes logoZoomOut {
      0% {
        opacity: 0;
        transform: scale(1.45);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }

    /* Sembunyikan splash screen selepas selesai */
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Skrin Logo Zoom Out -->
  <div id="splash-screen">
    <img id="splash-logo" src="icon.png" alt="PRISM AKM">
  </div>

  <!-- Sistem PRISM (Google Apps Script) -->
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzA8m1NzO-gLzWANOPtZchmlJuaEs_p3Q6BD7vPiAafCEzz1wRMXymJ0-ii-QELIflx/exec"></iframe>

  <script>
    window.addEventListener('load', function () {
      const splash = document.getElementById('splash-screen');
      // Papar animasi zoom-out selama 2 saat, kemudian pudar masuk ke skrin log masuk
      setTimeout(function () {
        splash.classList.add('fade-out');
      }, 2000);
    });
  </script>

</body>
</html>
